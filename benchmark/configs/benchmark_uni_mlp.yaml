# BEACON vs UNI+MLP ablation (Visium, Protocol B–style fairness)
# Same split / labels / UNI features as BEACON; head = MLP (no GAT).
# Run on a compute node (not login node).

project_root: /dssg/home/acct-drzhihongliu/drzhihongliu-user2/script/spatial_transcriptome/pathospatial_model

output_dir: benchmark/beacon_vs_uni_mlp/results

train_samples: [ST1, ST2, ST3, BC_B1, BC_C1, BC_D1]
val_samples: [ST4, BC_A1]

# Match decoder/gat_seed/gat_*_t6p2.py
mlp_training:
  input_dim: 1024
  epochs: 300
  lr: 0.0001
  weight_decay: 0.00001
  seed: 1
  log_every: 10
  # BEACON GAT uses dropout 0.3/0.2 on graph layers; MLP ablation uses 0.2
  dropout: 0.2

gatraining:
  input_dim: 1024
  k_neighbors: 6

targets:
  Tumor_EGFR:
    cell2location_column: q05cell_abundance_w_sf_Tumor_EGFR
    cell2location_column_legacy: q05cell_abundance_w_sf_tumor_CD59
    beacon_weights: decoder/gat_seed/model_weights/tumor_CD59/gat_abundance_head.pth
    uni_feature_dir: encoder/uni_v1/tumor_CD59/extracted_features_csv
  Mac_EREG:
    cell2location_column: q05cell_abundance_w_sf_Mac_EREG
    cell2location_column_legacy: q05cell_abundance_w_sf_Mφ_SOD2
    beacon_weights: decoder/gat_seed/model_weights/mac_sod2/gat_abundance_head.pth
    uni_feature_dir: encoder/uni_v1/Mac_SOD2/extracted_features_csv

samples:
  - paper_name: ST1
    internal_name: BCB1_0128
    deconv_csv: /dssg/home/acct-drzhihongliu/drzhihongliu-user2/script/spatial_transcriptome/cell2location/write/BCB1_0128_q05_cell_abundance_w_sf.csv

