# BEACON vs Path2Space-B — Visium Protocol B
# Retrain CTransPath (frozen) + MLP on bladder Visium niche abundances.
# Run on a compute node (not login node).

project_root: /dssg/home/acct-drzhihongliu/drzhihongliu-user2/script/spatial_transcriptome/pathospatial_model

output_dir: benchmark/beacon_vs_path2space/results

train_samples: [ST1, ST2, ST3, BC_B1, BC_C1, BC_D1]
val_samples: [ST4, BC_A1]

path2space:
  # Download ctranspath.pth from https://doi.org/10.5281/zenodo.20174301
  ctranspath_weights: benchmark/beacon_vs_path2space/weights/ctranspath.pth
  patch_size: 128
  batch_size: 64
  seed: 42
  # Path2Space-like: Adam lr=1e-4, dropout=0.2, max epochs + early stop
  # Early stop uses train-internal spot holdout only (never ST4 / BC_A1).
  epochs: 100
  lr: 0.0001
  weight_decay: 0.00001
  mlp_batch_size: 256
  mlp_hidden: [512, 256, 64]
  dropout: 0.2
  early_stop_frac: 0.2
  early_stop_patience: 80

targets:
  Tumor_EGFR:
    cell2location_column: q05cell_abundance_w_sf_Tumor_EGFR
    cell2location_column_legacy: q05cell_abundance_w_sf_tumor_CD59
    beacon_weights: decoder/gat_seed/model_weights/tumor_CD59/gat_abundance_head.pth
    beacon_feature_dir: encoder/uni_v1/tumor_CD59/extracted_features_csv
  Mac_EREG:
    cell2location_column: q05cell_abundance_w_sf_Mac_EREG
    cell2location_column_legacy: q05cell_abundance_w_sf_Mφ_SOD2
    beacon_weights: decoder/gat_seed/model_weights/mac_sod2/gat_abundance_head.pth
    beacon_feature_dir: encoder/uni_v1/Mac_SOD2/extracted_features_csv

